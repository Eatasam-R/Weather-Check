<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather Check
    </h1>
<div class="card">
    <div class="search">
        <input type="text" placeholder="Enter City Name" spellcheck="false" >
        <button><img src="search.png" alt="Search"></button>
    </div>
    <div class="error"><p>Invalid City Name</p></div>
    <div class="weather">
        <img src="rain.png" class="weather-icon">
        <h1 class="temp">32°C</h1>
        <h2 class="city">Rawalpindi</h2>
        <div class="details">
            <div class="col">
                    <img src="humidity.png" ="">
                <div class="humidity">
                    <p>Humidity</p>
                    <h2>80%</h2>
                </div>
            </div>
            <div class="col">
                    <img src="wind.png" ="">
                <div class="wind">
                        <p>Wind Speed</p>
                        <h2>12km/h</h2>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const apiKey = "255834178c0bb82efb520fe884928c40";
    const apiURL = `https://api.openweathermap.org/data/2.5/weather?units=metric&q=`;
    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");

    function performSearch() {
        const city = searchBox.value.trim();
        if (city) {
            checkWeather(city);
        }
    }

    async function checkWeather(city){
        const response = await fetch(apiURL + city +`&appid=${apiKey}`);
        
        if(response.status == 404){
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
        }
        else{
            document.querySelector(".error").style.display = "none";
        }
        
        var data = await response.json();

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity h2").innerHTML = data.main.humidity + "%";
        document.querySelector(".wind h2").innerHTML = data.wind.speed + " km/h";

        if(data.weather[0].main == "Clouds"){
            document.querySelector(".weather-icon").src = "clouds.png";
        }
        else if(data.weather[0].main == "Clear"){
            document.querySelector(".weather-icon").src = "clear.png";
        }
        else if(data.weather[0].main == "Rain"){
            document.querySelector(".weather-icon").src = "rain.png";
        }
        else if(data.weather[0].main == "Drizzle"){
            document.querySelector(".weather-icon").src = "drizzle.png";
        }
        else if(data.weather[0].main == "Mist"){
            document.querySelector(".weather-icon").src = "mist.png";
        }

        document.querySelector(".weather").style.display = "block";

    }

    searchBtn.addEventListener("click", performSearch);

    searchBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            performSearch();
        }
    });

</script>

</body>
</html>
